.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:var(--bg2)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.stub{border-top:2px dashed #c9a46a;margin:16px -6px 0;padding-top:14px}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const novowel=t=>t.toUpperCase().replace(/[AEIOU]/g,"").replace(/[.:–]/g,"").replace(/\s+/g," ").trim();

const rid=n=>Array.from({length:n},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.random()*31|0]).join('');

// ---------- fuzzy check ----------
const norm=s=>String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"").replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/th/g,"t").replace(/(.)\1+/g,"$1");
function lev(a,b){const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const raw=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function sim(a,b){if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}
function score(guess,title){if(raw(guess)===raw(title))return 1;const g=norm(guess);if(raw(guess).length<2)return 0;
 const parts=[title,title.split(/[:–]/)[0],title.replace(/^\d+:\s*/,"")].map(norm);return Math.max(...parts.map(t=>sim(g,t)))}
function check(guess,title){const s=score(guess,title);return s>=.7?"yes":s>=.5?"close":""}

// ---------- sound ----------
function beep(f=660,d=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toast(msg){const t=$('toast');t.innerHTML=msg;t.hidden=!msg}

// ---------- network ----------
function netPill(on){const n=$('net');n.className="pill "+(on?"on":"off");n.textContent=on?"Live":"Reconnecting…"}
function connect(i){return new Promise((res,rej)=>{if(!window.mqtt)return rej(new Error("lib"));
 const c=mqtt.connect(BROKERS[i],{clientId:"tgn_"+rid(12),clean:true,connectTimeout:7000,reconnectPeriod:2500,keepalive:30});
 const to=setTimeout(()=>{c.end(true);rej(new Error("timeout"))},8000);
 c.once("connect",()=>{clearTimeout(to);res(c)});
 c.on("connect",()=>netPill(true));c.on("offline",()=>netPill(false));c.on("reconnect",()=>netPill(false))})}
async function connectAny(pref){const order=pref==null?[0,1,2]:[pref];for(const i of order){try{const c=await connect(i);return[c,i]}catch(e){}}throw new Error("none")}
function pub(t,obj,retain){if(cli)cli.publish(base+t,obj==null?"":JSON.stringify(obj),{qos:1,retain:!!retain})}
function parse(p){try{const s=p.toString();return s?JSON.parse(s):null}catch(e){return null}}
const shareURL=()=>location.href.split("#")[0]+"#"+code+"-"+bi;

// ---------- home ----------
function home(err){role=null;hostBox.innerHTML="";guessBox.hidden=true;boardEl.innerHTML="";
 const h=(location.hash||"").slice(1).toUpperCase().match(/^([A-Z0-9]{5})(?:-(\d))?$/);
 app.innerHTML=`<section class="ticket">${err?`<p style="color:var(--bad);font-weight:600;margin-top:0">${esc(err)}</p>`:""}
 <h2>${h?"You're invited to room "+h[1]:"Start or join a game"}</h2>
 <label class="l" for="nm">Your name</label><input type="text" id="nm" maxlength="16" value="${esc(me.name)}" placeholder="e.g. Vivek">
 ${h?"":`<label class="l" for="cd">Room code</label><input type="text" id="cd" maxlength="5" placeholder="5 letters from your host" style="text-transform:uppercase">`}
 <div class="stub row"><button class="btn" id="join">${h?"Join game":"Join with code"}</button>${h?"":`<button class="btn ghost" id="host">Create a new game</button>`}</div></section>`;
 const nm=$('nm');nm.focus();
 const name=()=>{const v=nm.value.trim().slice(0,16);if(!v){nm.focus();nm.style.borderColor="var(--bad)";return null}me.name=v;ls.set("tgn_name",v);return v};
 $('join').onclick=()=>{if(!name())return;const c=h?h[1]:$('cd').value.trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c))return $('cd').focus();joinGame(c,h&&h[2]!=null?+h[2]:null)};
 const hb=$('host');if(hb)hb.onclick=()=>{if(name())hostGame()};}

// ---------- player ----------
async function joinGame(c,pref){app.innerHTML=`<section class="ticket"><div class="big">Connecting…</div></section>`;
 const saved=ls.get("tgn_host_"+c);if(saved){return hostGame(saved)}
 let r;try{r=await connectAny(pref)}catch(e){return home("Couldn't reach the game server. Check your internet and try again.")}
 [cli,bi]=r;code=c;base="tgn/v2/"+code;role="player";location.hash=code+"-"+bi;
 cli.on("message",(t,p)=>{const d=parse(p);if(t===base+"/s"){if(d)onState(d)}else if(t===base+"/x/"+me.id){secret=d;render()}});
 cli.subscribe([base+"/s",base+"/x/"+me.id],{qos:1});
 pub("/p/"+me.id,{name:me.name},true);
 V=null;render()}
let secret=null;
function sendGuess(text){if(!V||V.phase!=="clue"||V.locked)return;myGuess=text;
 if(role==="host")hostGuess(me.id,text);else pub("/g/"+me.id,{text,round:V.round});
 $('mine').textContent="Your answer: "+text;beep(700,.06)}
$('gf').addEventListener('submit',e=>{e.preventDefault();const v=$('gi').value.trim().slice(0,60);if(!v)return;sendGuess(v);$('gi').value=""});

function onState(s){const newRound=s.round!==lastRound;
 if(newRound){myGuess="";$('mine').textContent="";lastClue=0;if(s.phase==="clue")beep(523,.1)}
 if(s.phase==="reveal"&&V&&V.phase!=="reveal")beep(784,.2);
 if(s.left!=null)endLocal=Date.now()+s.left*1000;else endLocal=0;
 if(s.phase!=="end")fanfare=false;V=s;lastRound=s.round;render()}

// ---------- shared render ----------
function render(){if(!role)return;board();
 const v=V;
 if(!v){app.innerHTML=`<section class="ticket"><div class="big">Waiting for the host…</div><p class="hint">Room ${esc(code)}. If this takes long, ask the host to open their game.</p></section>`;guessBox.hidden=true;hostPanel();return}
 const isActor=v.mode==="charades"&&v.actor===me.id;
 toast(v.lastAward&&v.phase==="clue"?"Last film: "+v.lastAward.map(a=>`<b>${esc(a.name)}</b> +${a.pts}`).join(", "):"");
 if(v.phase==="lobby"){const inIt=v.players.some(p=>p.id===me.id);
  app.innerHTML=role==="host"?"":`<section class="ticket"><h2>${inIt?"You're in! 🎟️":"Joining…"}</h2><p class="hint" style="text-align:left">Waiting for the host to start. ${v.players.length} player${v.players.length===1?"":"s"} here.</p>
  <ul class="plist">${v.players.map(p=>`<li><span>${esc(p.name)}${p.id===me.id?" (you)":""}</span></li>`).join('')}</ul></section>`;
  guessBox.hidden=true;hostPanel();return}
 if(v.phase==="end"){const r=v.players.slice().sort((a,b)=>b.score-a.score);const tie=r.length>1&&r[0].score===r[1].score;
  app.innerHTML=`<section class="ticket"><div class="meta"><span>Final scores</span><span>${esc(MODES[v.mode].n)}</span></div><div class="big">${tie?"It's a tie! 🤝":"🏆 "+esc(r[0]?.name)+" wins!"}</div><ol class="podium">${r.map(p=>`<li><span>${esc(p.name)}</span><span>${p.score}</span></li>`).join('')}</ol>${role==="host"?"":`<p class="hint" style="margin-top:12px">The host can start another round.</p>`}</section>`;
  if(!fanfare){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*140));fanfare=true}
  guessBox.hidden=true;hostPanel();return}
 const sh=v.show||{},m=MODES[v.mode];let body="";
 if(v.mode==="ladder"){const labels=["Story","Year & music","Emoji","Director","Lead cast"];
  body=`<ul class="clues">${labels.map((l,i)=>i<sh.clues.length?`<li class="${i>=lastClue?"new":""}"><small>${l}</small>${i===2?`<span style="font-size:30px">${esc(sh.clues[i])}</span>`:esc(sh.clues[i])}</li>`:`<li class="locked"><small>Clue ${i+1}</small>Locked</li>`).join('')}</ul>`;lastClue=sh.clues.length}
 else if(v.mode==="emoji")body=`<div class="emoji">${esc(sh.e)}</div>`;
 else if(v.mode==="vowel")body=`<div class="big" style="letter-spacing:3px">${esc(sh.nv)}</div>`;
 else{const actor=v.players.find(p=>p.id===v.actor);
  body=isActor&&secret&&secret.round===v.round&&v.phase==="clue"?`<p class="hint">You're acting! Only you can see this. No talking 🤐</p><div class="ans">${esc(secret.t)}<small>${secret.words} word${secret.words>1?"s":""} · ${secret.y}</small></div>`:`<div class="big">🎭 ${esc(actor?actor.name:"Someone")} is acting</div><p class="hint">Watch them on the video call and type your guess.</p>`}
 const info=v.mode==="ladder"||isActor?"":`<p class="hint">${sh.words} word${sh.words>1?"s":""}${sh.hint?" · "+esc(sh.hint):""}</p>`;
 const pts=v.mode==="ladder"?`Worth ${6-sh.clues.length}`:v.mode==="charades"?"Worth 1":`Worth ${sh.hint?1:2}`;
 const timer=v.phase==="clue"&&endLocal?`<div class="secs" id="tn"></div>`:v.locked&&v.phase==="clue"?`<div class="secs">Time's up!</div>`:"";
 const ans=v.phase==="reveal"&&v.answer?`<div class="ans">${esc(v.answer.t)}<small>${v.answer.y} · ${esc(v.answer.l)} · dir. ${esc(v.answer.d)}</small></div>`:"";
 const all=v.phase==="reveal"&&v.answers&&role!=="host"?`<label class="l">Everyone's answers</label><ul class="plist">${v.answers.map(a=>`<li><span><b>${esc(a.name)}${a.id===me.id?" (you)":""}</b>: ${a.text?esc(a.text):"<i>no answer</i>"}</span>${a.c==="yes"?'<span class="tag">✓ correct</span>':a.c==="close"?'<span class="tag c">close</span>':""}</li>`).join('')}</ul>`:"";
 const status=v.phase==="reveal"?(role==="host"?"":`${all}<p class="hint" style="margin-top:10px">Host is confirming the points…</p>`):`<p class="hint" style="margin-top:8px">${v.guessed.length} of ${v.players.length-(v.mode==="charades"?1:0)} answered</p>`;
 app.innerHTML=`<section class="ticket"><div class="meta"><span>${esc(m.n)} · Film ${v.round}/${v.total}</span><span>${v.phase==="reveal"?"Answer":pts}</span></div>${body}${info}${timer}${ans}${status}</section>`;
 guessBox.hidden=!(v.phase==="clue"&&!v.locked&&!isActor);

function board(){const v=V;if(!v||v.phase==="lobby"){boardEl.innerHTML="";return}
 boardEl.innerHTML=v.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="sc${p.id===me.id?" me":""}"><b>${esc(p.name)}${p.id===me.id?" (you)":""}</b><span>${p.score}</span>${v.phase==="clue"&&v.guessed.includes(p.id)?"<i>✓</i>":v.mode==="charades"&&v.actor===p.id?"<i>🎭</i>":""}</div>`).join('')}

setInterval(tickT,250);

// ---------- host ----------
async function hostGame(saved){app.innerHTML=`<section class="ticket"><div class="big">Opening your room…</div></section>`;
 let r;try{r=await connectAny(saved?saved.bi:null)}catch(e){return home("Couldn't reach the game server. Check your internet and try again.")}
 [cli,bi]=r;role="host";
 H=saved||{code:rid(5).toUpperCase(),mode:"ladder",era:"all",films:10,phase:"lobby",players:{},order:[],round:0,total:0,deck:[],cur:-1,clue:1,hint:false,locked:false,endAt:0,actor:null,guesses:{},sel:{},lastAward:null};
 H.bi=bi;code=H.code;base="tgn/v2/"+code;location.hash=code+"-"+bi;
 addPlayer(me.id,me.name);
 cli.on("message",(t,p)=>{const d=parse(p),k=t.slice(base.length);
  if(k.startsWith("/p/")){const id=k.slice(3);if(d&&d.name)addPlayer(id,String(d.name).slice(0,16));}
  else if(k.startsWith("/g/")){const id=k.slice(3);if(d&&d.round===H.round)hostGuess(id,String(d.text||"").slice(0,60))}});
 cli.subscribe([base+"/p/+",base+"/g/+"],{qos:1});
 publish()}
function addPlayer(id,name){const ex=H.players[id];if(ex&&ex.name===name)return;H.players[id]={name,score:ex?ex.score:0};if(!H.order.includes(id))H.order.push(id);publish()}
function hostGuess(id,text){if(H.phase!=="clue"||H.locked||!H.players[id]||(H.mode==="charades"&&id===H.actor)||!text)return;
 H.guesses[id]={text,clue:H.clue,hint:H.hint};publish()}
const movie=()=>M[H.cur];
function pts(id){const g=H.guesses[id];if(H.mode==="ladder")return g?Math.max(1,6-g.clue):1;if(H.mode==="charades")return 1;return g&&g.hint?1:2}
function publish(){if(!H)return;ls.set("tgn_host_"+H.code,H);
 const m=H.cur>=0?movie():null,players=H.order.filter(id=>H.players[id]).map(id=>({id,name:H.players[id].name,score:H.players[id].score}));
 let show=null;
 if(m){if(H.mode==="ladder"){const c=[m.p,m.y+(m.m?" · music by "+m.m:""),m.e,m.d,m.l];show={clues:c.slice(0,H.clue)}}
  else{show={words:words(m.t),hint:H.hint?m.y+" · "+m.l:""};if(H.mode==="emoji")show.e=m.e;if(H.mode==="vowel")show.nv=novowel(m.t)}}
 const s={v:2,phase:H.phase,mode:H.mode,round:H.round,total:H.total,players,show,locked:H.locked,actor:H.actor,
  left:H.phase==="clue"&&H.endAt&&!H.locked?Math.max(0,Math.round((H.endAt-Date.now())/1000)):null,
  guessed:Object.keys(H.guesses),answers:H.phase==="reveal"&&m?players.filter(p=>!(H.mode==="charades"&&p.id===H.actor)).map(p=>{const g=H.guesses[p.id];return{id:p.id,name:p.name,text:g?g.text:"",c:g?check(g.text,m.t):"",pts:pts(p.id)}}):null,answer:H.phase==="reveal"&&m?{t:m.t,y:m.y,l:m.l,d:m.d}:null,lastAward:H.lastAward};
 pub("/s",s,true);onState(s)}
setInterval(()=>{if(H&&H.phase==="clue"&&H.endAt&&!H.locked&&Date.now()>=H.endAt){H.locked=true;beep(220,.5);publish()}},500);
function startGame(){const[,a,b]=ERAS[H.era];
 const pool=M.map((m,i)=>i).filter(i=>M[i].y>=a&&M[i].y<=b&&(H.mode!=="vowel"||novowel(M[i].t)!==M[i].t.toUpperCase()));
 let used=new Set(ls.get("tgn_used",[]));let fresh=pool.filter(i=>!used.has(M[i].t));if(fresh.length<H.films){used=new Set();fresh=pool}ls.set("tgn_used",[...used]);
 H.deck=shuf(fresh);H.total=Math.min(H.films,fresh.length);H.round=0;H.lastAward=null;
 for(const id in H.players)H.players[id].score=0;nextFilm()}
function nextFilm(){if(H.round>=H.total){H.phase="end";H.cur=-1;return publish()}
 H.round++;H.cur=H.deck.pop();{const u=ls.get("tgn_used",[]);u.push(M[H.cur].t);ls.set("tgn_used",u)}H.clue=1;H.hint=false;H.locked=false;H.guesses={};H.sel={};H.phase="clue";
 const tm=MODES[H.mode].tm;H.endAt=tm?Date.now()+tm*1000:0;
 if(H.mode==="charades"){const ids=H.order.filter(id=>H.players[id]);H.actor=ids[(H.round-1)%ids.length];const m=movie();
  pub("/x/"+H.actor,{round:H.round,t:m.t,y:m.y,words:words(m.t)},true);if(H.actor===me.id)secret={round:H.round,t:m.t,y:m.y,words:words(m.t)}}
 else H.actor=null;
 publish()}
function reveal(){H.phase="reveal";H.locked=true;H.sel={};const m=movie();
 for(const id in H.guesses)if(check(H.guesses[id].text,m.t)==="yes")H.sel[id]=true;publish()}
function award(){const out=[];for(const id in H.sel)if(H.sel[id]&&H.players[id]){const p=pts(id);H.players[id].score+=p;out.push({name:H.players[id].name,pts:p})}
 if(H.mode==="charades"&&out.length&&H.players[H.actor]&&!H.sel[H.actor]){H.players[H.actor].score+=1;out.push({name:H.players[H.actor].name+" (acting)",pts:1})}
 H.lastAward=out.length?out:null;if(H.mode==="charades")pub("/x/"+H.actor,null,true);nextFilm()}

function hostPanel(){if(role!=="host"||!H){hostBox.innerHTML="";return}
 if(H.phase==="lobby"){const url=shareURL(),msg=`🎬 Join my Tollywood Guess Night! Room ${code}\n${url}`;
  app.innerHTML=`<section class="ticket"><h2>Your room is live</h2><div class="code">${esc(code)}</div>
  <div class="link" id="lk">${esc(url)}</div>
  <div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Share on WhatsApp</a><button class="btn ghost" id="cp">Copy link</button></div>
  <label class="l">Players (${H.order.filter(id=>H.players[id]).length})</label>
  <ul class="plist">${H.order.filter(id=>H.players[id]).map(id=>`<li><span>${esc(H.players[id].name)}${id===me.id?" (you, host)":""}</span>${id===me.id?"":`<button class="x" data-k="${esc(id)}" aria-label="Remove">×</button>`}</li>`).join('')}</ul>
  <label class="l">Game</label><div class="chips">${Object.entries(MODES).map(([k,m])=>`<button class="chip" data-mode="${k}" aria-pressed="${H.mode===k}"><b>${m.n}</b><span>${m.s}</span></button>`).join('')}</div>
  <label class="l">Films from</label><div class="seg">${Object.entries(ERAS).map(([k,e])=>`<button class="chip" data-era="${k}" aria-pressed="${H.era===k}">${e[0]}</button>`).join('')}</div>
  <label class="l">Number of films</label><div class="seg">${[5,10,15,20].map(n=>`<button class="chip" data-f="${n}" aria-pressed="${H.films===n}">${n}</button>`).join('')}</div>
  <div class="stub"><button class="btn wide" id="go">Start the show 🎬</button><p class="hint" style="margin-top:8px;font-size:14px">${H.mode==="charades"?"Get everyone on a WhatsApp video call for charades.":"Players can join any time, even mid-game."}</p></div></section>`;
  hostBox.innerHTML="";
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('cp').textContent="Copied ✓"}catch(e){const r=document.createRange();r.selectNodeContents($('lk'));getSelection().removeAllRanges();getSelection().addRange(r);$('cp').textContent="Selected, copy it"}};
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const id=b.dataset.k;delete H.players[id];H.order=H.order.filter(x=>x!==id);pub("/p/"+id,null,true);publish()});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{H.mode=b.dataset.mode;publish()});
  app.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>{H.era=b.dataset.era;publish()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{H.films=+b.dataset.f;publish()});
  $('go').onclick=startGame;return}
 if(H.phase==="end"){hostBox.innerHTML=`<section class="ticket"><div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="lob">Back to lobby</button></div></section>`;
  $('again').onclick=startGame;$('lob').onclick=()=>{H.phase="lobby";H.lastAward=null;publish()};return}
 const ids=H.order.filter(id=>H.players[id]),m=movie();
 if(H.phase==="clue"){const n=Object.keys(H.guesses).length;
  hostBox.innerHTML=`<section class="ticket"><h2>Host controls</h2><div class="row">
  ${H.mode==="ladder"&&H.clue<5?`<button class="btn" id="more">Next clue</button>`:""}
  ${(H.mode==="emoji"||H.mode==="vowel")&&!H.hint?`<button class="btn ghost" id="hi">Give hint</button>`:""}
  <button class="btn ok" id="rv">Show answer</button></div>
  ${(()=>{const el=ids.filter(id=>!(H.mode==="charades"&&id===H.actor)),done=el.filter(id=>H.guesses[id]),wait=el.filter(id=>!H.guesses[id]);
   return `<p class="hint" style="text-align:left;margin-top:12px"><b>${done.length} of ${el.length} answered.</b>${done.length===el.length&&el.length?" Everyone's in, show the answer!":""}</p><ul class="plist">${done.map(id=>`<li><span>${esc(H.players[id].name)}</span><span class="tag">answered</span></li>`).join('')}${wait.map(id=>`<li><span>${esc(H.players[id].name)}</span><span class="tag c">waiting…</span></li>`).join('')}</ul>`})()}
  <div class="row" style="margin-top:12px"><button class="btn ghost" id="end">End game</button></div></section>`;
  const mo=$('more');if(mo)mo.onclick=()=>{H.clue++;publish()};
  const hi=$('hi');if(hi)hi.onclick=()=>{H.hint=true;publish()};
  $('rv').onclick=reveal;$('end').onclick=()=>{H.phase="end";publish()};return}
 // reveal: pick who scored
 const rows=ids.filter(id=>!(H.mode==="charades"&&id===H.actor)).map(id=>{const g=H.guesses[id],c=g?check(g.text,m.t):"";
  return `<button class="awr" data-s="${esc(id)}" aria-pressed="${!!H.sel[id]}"><span class="nm">${esc(H.players[id].name)}</span><span class="gs">${g?esc(g.text):"—"}</span>${c==="yes"?'<span class="tag">match</span>':c==="close"?'<span class="tag c">close</span>':""}<span class="pt">+${pts(id)}</span></button>`}).join('');
 hostBox.innerHTML=`<section class="ticket"><h2>Who got it?</h2><p class="hint" style="text-align:left">Tap everyone who should score. Answers that are 70% or more correct are already ticked. Everyone can see these answers now.${H.mode==="charades"?" The actor gets +1 if anyone scores.":""}</p>
 <div class="aw">${rows}</div><div class="stub"><button class="btn wide" id="aw">${H.round>=H.total?"Give points & finish":"Give points & next film"}</button></div></section>`;
 hostBox.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=b.dataset.s;H.sel[id]=!H.sel[id];b.setAttribute('aria-pressed',!!H.sel[id])});
 $('aw').onclick=award}

$("cnt").textContent=M.length;home();
}
</script>
</body>
</html>
